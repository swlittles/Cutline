name: macOS tests
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CUTLINE_RESULTS_DIR: ${{ github.workspace }}/test-results
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: brew install xcodegen ffmpeg
      - name: Validate release tooling
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Run unit, media integration, and native UI tests
        run: ./scripts/test-all.sh
      - name: Package release app
        run: ./scripts/build-app.sh
      - name: Preserve test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: test-results/
          retention-days: 14
